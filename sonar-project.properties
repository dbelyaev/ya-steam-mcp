# Read by SonarCloud automatic analysis and by command-line scanners.
# The Maven scanner derives sources from the pom and uses project.build.sourceEncoding (UTF-8).
sonar.sourceEncoding=UTF-8

# Analyze the product and its tests only. .claude/ holds third-party skill examples that are
# intentionally bad code, .tasks/ and docs/ are prose.
sonar.sources=src/main
sonar.tests=src/test
sonar.exclusions=.claude/**,.tasks/**,docs/**,target/**
