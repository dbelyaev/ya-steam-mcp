# Read by SonarCloud automatic analysis and by command-line scanners.
# The Maven scanner derives sources from the pom and uses project.build.sourceEncoding (UTF-8).
sonar.sourceEncoding=UTF-8

# Analyze the product and its tests only. .claude/ holds third-party skill examples that are
# intentionally bad code, .tasks/ and docs/ are prose.
sonar.sources=src/main
sonar.tests=src/test
sonar.exclusions=.claude/**,.tasks/**,docs/**,target/**

# Unit-test coverage written by jacoco-maven-plugin during the test phase. Only a build-based analysis
# (command-line scanner run after `./mvnw verify`) imports it: SonarCloud automatic analysis does not run
# the tests, and CI does not run a scanner yet, so nothing reads this path until such a step exists.
# The Maven scanner ignores this file; the same path is set as a property in pom.xml for it.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
