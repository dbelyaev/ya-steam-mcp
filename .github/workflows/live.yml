name: Live Steam smoke test

# Manual only. Never triggered by pull requests, so secrets are not exposed to forks.
# Needs repository secret STEAM_API_KEY and repository variable STEAM_ID (your own SteamID64).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Live smoke test
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ vars.STEAM_ID }}
        run: ./mvnw -B -ntp -Plive test
