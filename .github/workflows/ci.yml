name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the workflow only reads the repository. No secrets are used anywhere in it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show toolchain (JDK 25 is mandatory)
        run: |
          java -version
          ./mvnw -v
          java -version 2>&1 | grep -q '"25' || { echo "JDK 25 required"; exit 1; }

      # Unit tests, WireMock client tests, Spring tests, then the failsafe STDIO end-to-end tests
      # against the packaged jar. Everything Steam-related is stubbed: no API key is needed.
      # Tests tagged "live" are excluded by default and never run here.
      - name: Build and verify
        run: ./mvnw -B -ntp clean verify

      - name: Upload jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ya-steam-mcp-jar
          path: target/ya-steam-mcp-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Not pushed anywhere. Layers (dependencies, jar layers, jlink JRE) are cached in the GitHub cache.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ya-steam-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # stdout must be JSON-RPC frames only, six tools, exit 0 on EOF.
      - name: MCP smoke test
        run: |
          set -euo pipefail
          # the sleep keeps stdin open until the last reply is written; EOF then ends the server (exit 0)
          (cat docker/smoke-session.jsonl; sleep 3) | timeout 60 docker run -i --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges ya-steam-mcp:ci > out.jsonl 2> err.log
          while IFS= read -r line; do printf '%s' "$line" | jq -e . > /dev/null; done < out.jsonl
          test "$(jq -s '[.[] | select(.id == 2) | .result.tools | length] | first' out.jsonl)" = 6
          jq -e -s 'any(.[]; .id == 3 and .result.isError == true)' out.jsonl
