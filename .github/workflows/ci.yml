name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the workflow only reads the repository. No secrets are used anywhere in it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show toolchain (JDK 25 is mandatory)
        run: |
          java -version
          ./mvnw -v
          java -version 2>&1 | grep -q '"25' || { echo "JDK 25 required"; exit 1; }

      # Unit tests, WireMock client tests, Spring tests, then the failsafe STDIO end-to-end tests
      # against the packaged jar. Everything Steam-related is stubbed: no API key is needed.
      # Tests tagged "live" are excluded by default and never run here.
      - name: Build and verify
        run: ./mvnw -B -ntp clean verify

      - name: Upload jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ya-steam-mcp-jar
          path: target/ya-steam-mcp-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Not pushed anywhere. Layers (dependencies, jar layers, jlink JRE) are cached in the GitHub cache.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ya-steam-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The jar's protocol behaviour is covered by the e2e tests in `verify`. This only proves the image boots
      # (e.g. the jlink JRE has every module): stdin stays open while it starts, then EOF makes it exit 0.
      - name: Image boots
        run: |
          sleep 5 | timeout 60 docker run --rm -i --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            ya-steam-mcp:ci 2> err.log \
            || { echo "image failed to boot" >&2; cat err.log >&2; exit 1; }
