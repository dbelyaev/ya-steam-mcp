name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the workflow only reads the repository. No secrets are used anywhere in it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show toolchain (JDK 25 is mandatory)
        run: |
          java -version
          ./mvnw -v
          java -version 2>&1 | grep -q '"25' || { echo "JDK 25 required"; exit 1; }

      # Unit tests, WireMock client tests, Spring tests, then the failsafe STDIO end-to-end tests
      # against the packaged jar. Everything Steam-related is stubbed: no API key is needed.
      # Tests tagged "live" are excluded by default and never run here.
      - name: Build and verify
        run: ./mvnw -B -ntp clean verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: steam-mcp-server-jar
          path: target/steam-mcp-server-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          retention-days: 7
