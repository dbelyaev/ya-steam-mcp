version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Spring AI 2.0.x is paired with Boot 4.0/4.1; milestone releases are not wanted
      - dependency-name: "org.springframework.ai:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
